apiVersion: apps/v1
kind: Deployment
metadata:
    name: springapp
    namespace: test-ns
spec:
    replicas: 2
    selector:
        matchLabels: 
            name: springapp
    template:
        metadata:
            labels:
                name: springapp
        spec:
            containers:
            - name: springappcontainer
              image: dockerhandson/spring-boot-mongo:1
              ports:
              -  containerPort: 8080
              resources:
                  requests:
                      cpu: "200m"
                      memory: "256Mi"
                  limits:
                      cpu: "500m"
                      memory: "512Mi"
              env:
              -   name: MONGO_DB_HOSTNAME
                  value: mongosvc
              -   name: MONGO_DB_USERNAME
                  value: devdb
              -   name: MONGO_DB_PASSWORD
                  value: devdb@123
---
apiVersion: v1
kind: Service
metadata:
    name: springappsvc
    namespace: test-ns
spec:
    type: NodePort
    selector:
        name: springapp
    ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
    name: mongodb
    namespace: test-ns
spec:
    selector:
        matchLabels:
            app: mongo
    template:
        metadata:
            name: myapp
            labels:
               app: mongo
        spec:
            containers:
            -    name: mongodbcontainer
                 image:  mongo
                 ports:
                 -   containerPort: 27017
                 env:
                 -   name: MONGO_INITDB_ROOT_USERNAME
                     value: devdb
                 -   name:  MONGO_INITDB_ROOT_PASSWORD
                     value: devdb@123
---
apiVersion: v1
kind: Service
metadata:
    name: mongosvc
    namespace: test-ns
spec:
    type: ClusterIP
    selector:
        app: mongo
    ports:
    -  port: 27017
       targetPort: 27017
# Check kubectl is connected to your cluster
kubectl cluster-info

# Create the namespace first (since all resources use test-ns)
kubectl create namespace test-ns

# Apply the entire file at once
kubectl apply -f filename.yaml

# Example if your file is named app.yaml
kubectl apply -f app.yaml
# Check all resources in the namespace at once
kubectl get all -n test-ns

# Check Deployment
kubectl get deployment springapp -n test-ns

# Check ReplicaSet (MongoDB)
kubectl get replicaset mongodb -n test-ns

# Check Pods
kubectl get pods -n test-ns

# Check Services
kubectl get svc -n test-ns
