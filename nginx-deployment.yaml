apiVersion: apps/v1        # API version for Deployments
kind: Deployment           # Object type = Deployment
metadata:
  name: nginx-deployment   # Name of the Deployment
  labels:
    app: nginx             # Label on the Deployment itself
spec:
  replicas: 2              # Run 2 pods at all times
  selector:
    matchLabels:
      app: nginx           # Deployment manages pods with this label
  template:                # Pod template (blueprint for each pod)
    metadata:
      labels:
        app: nginx         # Label applied to every pod created
    spec:
      containers:
      - name: nginx                # Container name
        image: nginx:latest        # Docker image used
        ports:
        - containerPort: 80        # Port nginx listens on
        # Apply the deployment
kubectl apply -f nginx-deployment.yaml

# Check deployment
kubectl get deployment nginx-deployment

# Check pods created
kubectl get pods

# Check pods with labels
kubectl get pods --show-labels
