apiVersion: apps/v1
kind: Deployment
metadata:
    name: mavenwebapp
    namespace: test-ns
spec:
    replicas: 2
    strategy: 
       type: Recreate
    selector:
        matchLabels:
            app: mavenwebapp
    template:
        metadata:
            name: mavenwebapppod
            labels:
                app: mavenwebapp
        spec:
            containers:
            -   name: mavenwebappcontainer
                image: dockerhandson/maven-web-application:2
                ports:
                - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
    name: mavenwebappsvc
    namespace: test-ns
spec:
    type: NodePort
    selector:
        app: mavenwebapp
    ports:
    -    port: 80
         targetPort: 8080
# Create namespace if not already created
kubectl create namespace test-ns

# Apply the manifest
kubectl apply -f mavenwebapp.yaml

# Check everything in the namespace
kubectl get all -n test-ns

# Check deployment specifically
kubectl get deployment mavenwebapp -n test-ns

# Check pods
kubectl get pods -n test-ns

# Check service
kubectl get svc mavenwebappsvc -n test-ns

# Watch the deployment rollout
kubectl rollout status deployment/mavenwebapp -n test-ns

# Check rollout history
kubectl rollout history deployment/mavenwebapp -n test-ns
